<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img">
<title>Architecture of rafaelinfante.net on AWS</title>
<desc>Visitors reach the site through Route 53 DNS and CloudFront, which serves files from a private S3 bucket over HTTPS using an ACM certificate. Pushing to the main branch runs a GitHub Actions workflow that assumes a least-privilege IAM role via OIDC, uploads the build to S3, and invalidates the CloudFront cache.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
</style>
<defs>
<marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="392" fill="#ffffff"/>

<line x1="100" y1="136" x2="100" y2="179" stroke="#0d9488" stroke-width="1.5" marker-end="url(#aTeal)"/>
<line x1="160" y1="108" x2="249" y2="142" stroke="#0d9488" stroke-width="1.5" marker-end="url(#aTeal)"/>
<line x1="160" y1="206" x2="249" y2="164" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aTeal)"/>
<line x1="337" y1="180" x2="337" y2="231" stroke="#0d9488" stroke-width="1.5" marker-end="url(#aTeal)"/>
<line x1="337" y1="88" x2="337" y2="119" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aTeal)"/>

<line x1="570" y1="100" x2="570" y2="129" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#aPurple)"/>
<line x1="570" y1="190" x2="570" y2="231" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#aPurple)"/>
<line x1="500" y1="168" x2="426" y2="248" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#aPurple)"/>
<line x1="500" y1="152" x2="426" y2="150" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#aPurple)"/>

<text class="s" x="182" y="186" fill="#64748b">alias</text>
<text class="s" x="344" y="106" fill="#64748b">cert</text>

<rect x="40" y="80" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text class="t" x="100" y="104" text-anchor="middle" fill="#1e293b">Visitor</text>
<text class="s" x="100" y="122" text-anchor="middle" fill="#475569">web browser</text>

<rect x="40" y="180" width="120" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
<text class="t" x="100" y="204" text-anchor="middle" fill="#134e4a">Route 53</text>
<text class="s" x="100" y="222" text-anchor="middle" fill="#0f766e">DNS</text>

<rect x="250" y="44" width="175" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
<text class="t" x="337" y="62" text-anchor="middle" fill="#134e4a">ACM</text>
<text class="s" x="337" y="79" text-anchor="middle" fill="#0f766e">TLS certificate</text>

<rect x="250" y="120" width="175" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
<text class="t" x="337" y="145" text-anchor="middle" fill="#134e4a">CloudFront</text>
<text class="s" x="337" y="164" text-anchor="middle" fill="#0f766e">CDN · HTTPS · cache</text>

<rect x="250" y="232" width="175" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
<text class="t" x="337" y="257" text-anchor="middle" fill="#134e4a">S3 bucket</text>
<text class="s" x="337" y="276" text-anchor="middle" fill="#0f766e">private · site files</text>

<rect x="500" y="44" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text class="t" x="570" y="68" text-anchor="middle" fill="#1e293b">Developer</text>
<text class="s" x="570" y="86" text-anchor="middle" fill="#475569">push to main</text>

<rect x="500" y="130" width="140" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
<text class="t" x="570" y="155" text-anchor="middle" fill="#4c1d95">GitHub Actions</text>
<text class="s" x="570" y="174" text-anchor="middle" fill="#6d28d9">deploy workflow</text>

<rect x="500" y="232" width="140" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
<text class="t" x="570" y="257" text-anchor="middle" fill="#134e4a">IAM OIDC role</text>
<text class="s" x="570" y="276" text-anchor="middle" fill="#0f766e">keyless · scoped</text>

<circle cx="100" cy="158" r="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text class="s" x="100" y="162" text-anchor="middle" fill="#0f766e">1</text>
<circle cx="205" cy="125" r="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text class="s" x="205" y="129" text-anchor="middle" fill="#0f766e">2</text>
<circle cx="337" cy="206" r="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text class="s" x="337" y="210" text-anchor="middle" fill="#0f766e">3</text>
<circle cx="570" cy="211" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text class="s" x="570" y="215" text-anchor="middle" fill="#6d28d9">A</text>
<circle cx="462" cy="210" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text class="s" x="462" y="214" text-anchor="middle" fill="#6d28d9">B</text>
<circle cx="462" cy="151" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text class="s" x="462" y="155" text-anchor="middle" fill="#6d28d9">C</text>

<rect x="40" y="312" width="12" height="12" rx="3" fill="#0d9488"/>
<text class="s" x="58" y="322" fill="#475569">Serving:  1 DNS (Route 53)   2 HTTPS request   3 S3 read via OAC</text>
<rect x="40" y="332" width="12" height="12" rx="3" fill="#7c3aed"/>
<text class="s" x="58" y="342" fill="#475569">Deploy:  A assume role (OIDC, keyless)   B upload to S3   C invalidate CloudFront</text>
<text class="s" x="58" y="362" fill="#475569">Dashed = DNS alias &amp; TLS certificate.   AWS region: us-east-1.</text>
<text class="s" x="58" y="380" fill="#475569">S3 bucket is private — only CloudFront can read it via Origin Access Control.</text>
</svg>
